<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matjeger handleliste, mockup</title>
<style>
  :root {
    --background:#f7f5f0; --foreground:#1a1f1a; --card:#f7f5f0; --primary:#2d6a4f; --primary-foreground:#f7f5f0;
    --secondary:#e8ede8; --muted:#eff2ef; --muted-foreground:#5a6b5a; --accent:#c8dcc8; --accent-foreground:#1a3d2a;
    --destructive:#c0392b; --border:#d4dcd4; --ring:#2d6a4f; --warn:#b45309; --radius:6px;
  }
  :root.dark {
    --background:#0d1411; --foreground:#c8d5c8; --card:#141f1a; --primary:#63c48c; --primary-foreground:#0a1a10;
    --secondary:#1e2e23; --muted:#192419; --muted-foreground:#8fac8f; --accent:#1e3a28; --accent-foreground:#a8cba8;
    --border:#2a3d2e; --ring:#63c48c; --warn:#fbbf24;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--background); color:var(--foreground); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button { font:inherit; color:inherit; cursor:pointer; }
  a { color:inherit; }
  .app { max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; border-inline:1px solid var(--border); }
  header.top { position:sticky; top:0; z-index:5; background:var(--background); border-bottom:1px solid var(--border); height:56px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; }
  header.top b { font-size:18px; letter-spacing:-.01em; }
  main { flex:1; padding-bottom:72px; }
  nav.bottom { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; height:64px; background:var(--background); border-top:1px solid var(--border); display:flex; z-index:6; }
  nav.bottom button { flex:1; border:0; background:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size:12px; color:var(--muted-foreground); }
  nav.bottom button[aria-current="page"] { color:var(--primary); }
  svg.i { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  .page { display:flex; flex-direction:column; gap:16px; padding:16px; }
  h1 { font-size:20px; margin:0; font-weight:600; }
  h2 { font-size:16px; margin:0; font-weight:500; }
  .muted { color:var(--muted-foreground); }
  .sm { font-size:14px; }
  .warn { color:var(--warn); font-size:14px; }
  .box { border:1px solid var(--border); border-radius:var(--radius); }
  .btn { min-height:44px; padding:0 16px; border-radius:var(--radius); border:1px solid var(--border); background:var(--background); display:inline-flex; align-items:center; justify-content:center; gap:8px; font-size:14px; font-weight:500; text-decoration:none; }
  .btn.primary { background:var(--primary); color:var(--primary-foreground); border-color:var(--primary); }
  .btn.ghost { border-color:transparent; }
  .icon-btn { width:44px; height:44px; border-radius:var(--radius); border:1px solid transparent; background:none; display:inline-flex; align-items:center; justify-content:center; flex:none; }
  .icon-btn:hover { background:var(--accent); }
  .icon-btn[disabled] { opacity:.4; cursor:default; }
  :focus-visible { outline:2px solid var(--ring); outline-offset:2px; }
  input[type=text] { height:40px; width:100%; border:1px solid var(--border); border-radius:var(--radius); padding:0 12px; background:transparent; color:inherit; font:inherit; }
  /* list rows */
  ul.rows { list-style:none; margin:0; padding:0; }
  ul.rows > li + li { border-top:1px solid var(--border); }
  .item { display:grid; grid-template-columns:44px 1fr 44px; align-items:start; padding:4px 4px 4px 0; }
  .item.done .name { text-decoration:line-through; color:var(--muted-foreground); }
  .item .check { display:flex; align-items:center; justify-content:center; width:44px; height:44px; }
  .item input[type=checkbox] { width:22px; height:22px; accent-color:var(--primary); margin:0; }
  .item .body { padding:8px 0 4px; min-width:0; }
  .name { font-weight:500; overflow-wrap:anywhere; }
  .stepper { display:inline-flex; align-items:center; margin-top:4px; margin-left:-10px; }
  .stepper output { min-width:32px; text-align:center; font-weight:500; }
  .count-chip { display:inline-block; background:var(--secondary); border-radius:999px; padding:0 8px; font-size:12px; }
  .row-err { grid-column:2 / 4; padding:0 4px 8px 0; font-size:14px; color:var(--destructive); }
  /* search + product rows */
  .result { display:flex; align-items:center; }
  .result a { flex:1; display:flex; flex-direction:column; padding:12px 16px; text-decoration:none; min-width:0; }
  .result .icon-btn { margin-right:4px; }
  .added { color:var(--primary); }
  /* plan cards */
  details.plan { border:1px solid var(--border); border-radius:var(--radius); }
  details.plan + details.plan { margin-top:8px; }
  details.plan[open] > summary .chev { transform:rotate(180deg); }
  details.plan > summary { list-style:none; display:grid; grid-template-columns:28px 1fr auto 20px; gap:0 8px; align-items:start; padding:12px; cursor:pointer; min-height:44px; }
  details.plan > summary::-webkit-details-marker { display:none; }
  .rank { width:24px; height:24px; border-radius:999px; background:var(--secondary); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; margin-top:1px; }
  .best .rank { background:var(--primary); color:var(--primary-foreground); }
  .total { font-weight:600; text-align:right; white-space:nowrap; }
  .sub { grid-column:2 / 3; font-size:14px; color:var(--muted-foreground); }
  .flag { grid-column:2 / 4; font-size:14px; }
  .badge { display:inline-block; background:var(--accent); color:var(--accent-foreground); border-radius:999px; padding:0 8px; font-size:12px; font-weight:500; margin-left:6px; vertical-align:2px; }
  .chev { transition:transform .15s; margin-top:2px; }
  .group { border-top:1px solid var(--border); padding:12px; }
  .group h3 { margin:0 0 4px; font-size:14px; font-weight:600; display:flex; justify-content:space-between; gap:8px; }
  .line { display:flex; justify-content:space-between; gap:12px; padding:4px 0; font-size:14px; }
  .line.done .l { text-decoration:line-through; color:var(--muted-foreground); }
  .line .r { white-space:nowrap; text-align:right; }
  /* skeleton */
  .sk { background:var(--muted); border-radius:var(--radius); animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.5; } }
  .center { display:flex; flex-direction:column; align-items:center; text-align:center; gap:12px; padding:48px 16px; }
  .center svg.i { width:40px; height:40px; color:var(--muted-foreground); }
  .summary { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:12px; border-radius:var(--radius); background:var(--secondary); text-decoration:none; font-size:14px; }
  /* mock-only controls */
  .mock { border-bottom:1px dashed var(--border); padding:8px 16px; font-size:13px; background:var(--muted); }
  .mock summary { cursor:pointer; min-height:28px; }
  .mock .opts { display:flex; flex-wrap:wrap; gap:6px; padding:6px 0; }
  .mock button { border:1px solid var(--border); background:var(--background); border-radius:var(--radius); padding:2px 8px; min-height:28px; }
  .mock button[aria-pressed="true"] { background:var(--primary); color:var(--primary-foreground); border-color:var(--primary); }
</style>
</head>
<body>
<div class="app">
  <details class="mock">
    <summary>Mockup: velg tilstand (ikke en del av appen)</summary>
    <div class="opts" id="opts"></div>
  </details>
  <header class="top"><b>Matjeger</b>
    <button class="icon-btn" id="theme" aria-label="Bytt tema"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </header>
  <main id="main"></main>
  <nav class="bottom" id="nav" aria-label="Hovedmeny"></nav>
</div>
<script>
const ICON = {
  scan:'<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M12 8v8M17 8v8"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  cart:'<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>',
  user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  plus:'<path d="M5 12h14M12 5v14"/>', minus:'<path d="M5 12h14"/>', check:'<path d="M20 6 9 17l-5-5"/>',
  trash:'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/>',
  chev:'<path d="m6 9 6 6 6-6"/>', warn:'<path d="m21.7 18-8-14a2 2 0 0 0-3.5 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3M12 9v4M12 17h.01"/>'
};
const svg = (n, cls='') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
const STORE = { KIWI:'Kiwi', REMA_1000:'Rema 1000', MENY:'Meny', SPAR:'Spar' };
const kr = o => new Intl.NumberFormat('nb-NO',{style:'currency',currency:'NOK'}).format(o/100).replace(/ /g,' ');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const PRODUCTS = [
  { id:'p1', name:'Lettmelk 1 l', brand:'Tine' },
  { id:'p2', name:'Kneippbrød', brand:'Mesterbakeren' },
  { id:'p3', name:'Egg 12 stk', brand:'Prior' },
  { id:'p4', name:'Meierismør 250 g', brand:'Tine' },
  { id:'p5', name:'Havregryn 1 kg', brand:'Freia' },
  { id:'p6', name:'Kaffe filtermalt 500 g', brand:'Evergood' },
  { id:'p7', name:'Salami 140 g', brand:'Gilde' },
];
const PRICES = { // øre, days since report
  p1:{ KIWI:[2190,3], REMA_1000:[2250,5], MENY:[2490,2] },
  p2:{ KIWI:[3290,3], REMA_1000:[2990,9], MENY:[3990,2] },
  p3:{ KIWI:[3990,45], REMA_1000:[3690,6] },
  p4:{ REMA_1000:[5490,6], MENY:[5990,2] },
  p5:{ KIWI:[1890,4] },
  p6:{},
  p7:{ SPAR:[3290,4] },
};
const byId = id => PRODUCTS.find(p => p.id === id);
const STALE_DAYS = 30;

function computePlans(items) {
  const priceOf = (id, s) => PRICES[id] && PRICES[id][s];
  const priceable = items.filter(i => Object.keys(STORE).some(s => priceOf(i.id, s)));
  const nobody = items.filter(i => !priceable.includes(i));
  const stores = Object.keys(STORE).filter(s => priceable.some(i => priceOf(i.id, s)));
  const plans = stores.map(base => {
    const own = priceable.filter(i => priceOf(i.id, base));
    const gaps = priceable.filter(i => !priceOf(i.id, base));
    let extra = null;
    for (const x of stores) {
      if (x === base) continue;
      const covered = gaps.filter(i => priceOf(i.id, x));
      if (!covered.length) continue;
      const cost = covered.reduce((a, i) => a + priceOf(i.id, x)[0] * i.qty, 0);
      if (!extra || covered.length > extra.covered.length || (covered.length === extra.covered.length && cost < extra.cost)) extra = { store:x, covered, cost };
    }
    const groups = [{ store:base, items:own }];
    if (extra) groups.push({ store:extra.store, items:extra.covered });
    const unpriced = gaps.filter(i => !extra || !extra.covered.includes(i));
    let total = 0, stale = 0;
    groups.forEach(g => { g.sum = 0; g.items.forEach(i => { const [p, d] = priceOf(i.id, g.store); g.sum += p * i.qty; if (d > STALE_DAYS) stale++; }); total += g.sum; });
    return { base, groups, unpriced, total, stale };
  });
  plans.sort((a, b) => a.unpriced.length - b.unpriced.length || a.total - b.total || a.groups.length - b.groups.length || STORE[a.base].localeCompare(STORE[b.base], 'nb'));
  const seen = new Set();
  const unique = plans.filter(pl => {
    const key = pl.groups.map(g => g.store + ':' + g.items.map(i => i.id).sort()).sort().join('|');
    if (seen.has(key)) return false;
    seen.add(key); return true;
  });
  return { plans:unique, nobody };
}

const S = { screen:'list', mode:'items', postal:'0150', onList:{ p1:1 }, err:null,
  items:[ {id:'p1',qty:2,checked:false}, {id:'p2',qty:1,checked:false}, {id:'p3',qty:1,checked:true}, {id:'p4',qty:1,checked:false}, {id:'p5',qty:1,checked:false}, {id:'p6',qty:1,checked:false} ] };

const MODES = [['items','Med varer'],['empty','Tom liste'],['loading','Laster'],['error','Feil ved henting'],['nopostal','Uten postnummer'],['noprices','Ingen priser'],['rowerr','Feil på en vare'],['partial','Delvis dekket']];
const SCREENS = [['list','Handleliste'],['search','Søk'],['product','Produktside']];

function renderOpts() {
  document.getElementById('opts').innerHTML =
    SCREENS.map(([k,l]) => `<button data-screen="${k}" aria-pressed="${S.screen===k}">${l}</button>`).join('') + '<span>|</span>' +
    MODES.map(([k,l]) => `<button data-mode="${k}" aria-pressed="${S.mode===k}">${l}</button>`).join('');
}
function renderNav() {
  const cur = { list:'cart', search:'search', product:'search' }[S.screen];
  document.getElementById('nav').innerHTML = [['scan','scan','Skann'],['search','search','Søk'],['cart','cart','Handleliste'],['user','user','Profil']]
    .map(([k,ic,l]) => `<button ${cur===k?'aria-current="page"':''} data-nav="${k}">${svg(ic)}<span>${l}</span></button>`).join('');
}

function listScreen() {
  if (S.mode === 'loading') return `<div class="page" aria-busy="true"><p role="status" style="position:absolute;left:-9999px">Laster…</p>
    <div class="sk" style="height:28px;width:50%"></div>
    <div class="sk" style="height:44px"></div>
    <div class="sk" style="height:220px"></div><div class="sk" style="height:28px;width:40%"></div><div class="sk" style="height:96px"></div></div>`;
  if (S.mode === 'error') return `<div class="center"><p style="font-weight:600;margin:0">Kunne ikke hente handlelisten.</p><p class="muted sm" style="margin:0">Sjekk nettforbindelsen og prøv igjen.</p><button class="btn" data-act="retry">Prøv igjen</button></div>`;
  const items = S.mode === 'empty' ? [] : (S.mode === 'partial' ? [...S.items, { id:'p7', qty:1, checked:false }] : S.items);
  if (!items.length) return `<div class="center">${svg('cart')}<h1>Handlelisten er tom</h1>
    <p class="muted" style="margin:0">Søk etter varer og legg dem til, så finner vi butikken der du sparer mest.</p>
    <a class="btn primary" href="#" data-nav="search">Søk etter varer</a><a class="btn ghost" href="#" data-nav="scan">Skann en vare</a></div>`;

  const noPostal = S.mode === 'nopostal', noPrices = S.mode === 'noprices';
  const priced = (id) => !noPrices && PRICES[id] && Object.keys(PRICES[id]).length;
  const { plans, nobody } = (noPostal || noPrices) ? { plans:[], nobody:[] } : computePlans(items);
  const n = items.length, checked = items.filter(i => i.checked).length;

  let html = `<div class="page"><div><h1>Handlelisten</h1><p class="muted sm" style="margin:0">${n} ${n===1?'vare':'varer'}</p></div>`;
  if (plans.length) {
    const p = plans[0];
    html += `<a class="summary" href="#billigste-butikk" data-act="jump"><span style="display:flex;flex-direction:column"><span>${p.unpriced.length ? 'Færrest varer mangler' : 'Billigst'}: <b>${STORE[p.base]}</b>, ${p.unpriced.length?'fra ':''}${kr(p.total)}</span><span class="muted">Se sammenligning</span></span>${svg('chev')}</a>`;
  }
  html += `<ul class="rows box">` + items.map((it, idx) => {
    const p = byId(it.id), name = esc(p.name);
    const err = S.mode === 'rowerr' && idx === 1;
    return `<li><div class="item ${it.checked?'done':''}">
      <label class="check"><input type="checkbox" data-act="check" data-id="${it.id}" ${it.checked?'checked':''} aria-label="Marker «${name}»"></label>
      <div class="body"><div class="name">${name}</div><div class="muted sm">${esc(p.brand)}</div>
        ${(!priced(it.id) && !noPostal) ? `<div class="muted sm">Ingen pris i ${S.postal} ennå</div>` : ''}
        <div class="stepper" role="group" aria-label="Antall «${name}»">
          <button class="icon-btn" data-act="dec" data-id="${it.id}" aria-label="Færre «${name}»" ${it.qty<=1?'disabled':''}>${svg('minus')}</button>
          <output aria-live="polite">${it.qty}</output>
          <button class="icon-btn" data-act="inc" data-id="${it.id}" aria-label="Flere «${name}»" ${it.qty>=99?'disabled':''}>${svg('plus')}</button>
        </div></div>
      <button class="icon-btn" data-act="remove" data-id="${it.id}" aria-label="Fjern «${name}» fra listen">${svg('trash')}</button>
      ${err ? '<p class="row-err" role="alert">Kunne ikke lagre endringen. Prøv igjen.</p>' : ''}
    </div></li>`;
  }).join('') + `</ul>`;
  if (checked) html += `<button class="btn" data-act="clear">Fjern markerte varer fra listen (${checked})</button>`;

  html += `<section id="billigste-butikk" style="scroll-margin-top:64px"><h2>Billigste butikk</h2>`;
  if (noPostal) html += `<p class="muted sm" style="margin:4px 0 0">Lagre postnummeret ditt over for å se hvilken butikk som er billigst.</p>`;
  else if (!plans.length) html += `<p class="muted sm" style="margin:4px 0 0">Ingen har rapportert priser for varene på listen i ${S.postal} ennå. Åpne en vare og rapporter prisen.</p>`;
  else {
    html += `<p class="muted sm" style="margin:0 0 8px">Priser for postnummer ${S.postal}</p>` + plans.map((p, i) => planCard(p, i, i === 0 && !p.unpriced.length)).join('');
    if (nobody.length) html += `<p class="muted sm" style="margin:12px 0 0">Ingen pris ennå, ikke med i sammenligningen: ${nobody.map(i => esc(byId(i.id).name)).join(', ')}.</p>`;
  }
  return html + `</section></div>`;
}

function planCard(p, i, best) {
  const stops = p.groups.length;
  const sub = stops === 1 ? `Alt hos ${STORE[p.base]}` : `${STORE[p.base]} og ${STORE[p.groups[1].store]}`;
  const flags = [];
  if (p.unpriced.length) flags.push(`<div class="flag warn">${svg('warn')} Mangler pris for ${p.unpriced.length} ${p.unpriced.length===1?'vare':'varer'}, totalen er minst ${kr(p.total)}</div>`);
  if (p.stale) flags.push(`<div class="flag warn">Inkluderer ${p.stale} ${p.stale===1?'gammel pris':'gamle priser'}</div>`);
  const line = (it, store) => {
    const [pr, d] = PRICES[it.id][store], pd = byId(it.id);
    return `<li class="line ${it.checked?'done':''}"><span class="l">${it.qty} × ${esc(pd.name)}${d>STALE_DAYS?`<br><span class="warn">Gammel pris, rapportert for ${d} dager siden</span>`:''}</span><span class="r">${kr(pr*it.qty)}</span></li>`;
  };
  return `<details class="plan ${best?'best':''}" ${i===0?'open':''}><summary>
    <span class="rank">${i+1}</span><span><b>${STORE[p.base]}</b>${best?'<span class="badge">Billigst</span>':''}</span>
    <span class="total">${p.unpriced.length?'Fra ':''}${kr(p.total)}</span><span class="chev">${svg('chev')}</span>
    <span class="sub">${sub} · ${stops} stopp</span>${flags.join('')}</summary>
    ${p.groups.map(g => `<div class="group"><h3><span>Handle hos ${STORE[g.store]}</span><span>${kr(g.sum)}</span></h3><ul class="rows">${g.items.map(it => line(it, g.store)).join('')}</ul></div>`).join('')}
    ${p.unpriced.length ? `<div class="group"><h3><span>Mangler i denne planen</span></h3><ul class="rows">${p.unpriced.map(it => `<li class="line"><span class="l">${it.qty} × ${esc(byId(it.id).name)}</span></li>`).join('')}</ul><p class="muted sm" style="margin:4px 0 0">Disse har pris i andre butikker, men ikke hos de to i denne planen.</p></div>` : ''}
  </details>`;
}

function addBtn(p, labelled) {
  const on = S.onList[p.id];
  const n = esc(p.name);
  if (labelled) return on
    ? `<div style="display:flex;gap:8px;align-items:center"><span class="added" style="flex:1;display:inline-flex;align-items:center;gap:8px;font-weight:500">${svg('check')} På handlelisten</span><a class="btn" href="#" data-nav="cart">Se listen</a></div>`
    : `<button class="btn primary" data-act="add" data-id="${p.id}" style="width:100%">${svg('plus')} Legg til på handlelisten</button>`;
  return on
    ? `<span class="icon-btn added" role="img" aria-label="«${n}» er på handlelisten">${svg('check')}</span>`
    : `<button class="icon-btn" data-act="add" data-id="${p.id}" aria-label="Legg til «${n}» på handlelisten">${svg('plus')}</button>`;
}
function searchScreen() {
  return `<div class="page"><form class="nope" style="display:flex;gap:8px"><input type="text" value="mel" aria-label="Søk etter produkter"><button type="button" class="btn primary">Søk</button></form>
  <ul class="rows box">${PRODUCTS.slice(0,4).map(p => `<li class="result"><a href="#" data-nav="product"><span style="font-weight:500">${esc(p.name)}</span><span class="muted sm">${esc(p.brand)}</span></a>${addBtn(p,false)}</li>`).join('')}</ul></div>`;
}
function productScreen() {
  const p = PRODUCTS[0];
  return `<div class="page"><div><h1>${p.name}</h1><p class="muted sm" style="margin:0">${p.brand}</p></div>${addBtn(p,true)}
   <section><h2 style="margin-bottom:8px">Priser i ${S.postal}</h2><div class="box" style="padding:12px;display:flex;justify-content:space-between"><b>Kiwi</b><b>${kr(2190)}</b></div></section></div>`;
}

function render() {
  renderOpts(); renderNav();
  document.getElementById('main').innerHTML = { list:listScreen, search:searchScreen, product:productScreen }[S.screen]();
}
function syncOnList() { S.onList = Object.fromEntries(S.items.map(i => [i.id, 1])); }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-screen],[data-mode],[data-act],[data-nav]'); if (!t) return;
  const d = t.dataset;
  if (d.screen) S.screen = d.screen;
  else if (d.mode) { S.mode = d.mode; S.screen = 'list'; }
  else if (d.nav) { e.preventDefault(); S.screen = { cart:'list', search:'search', product:'product', scan:'search' }[d.nav] || 'list'; }
  else if (d.act === 'jump') { e.preventDefault(); document.getElementById('billigste-butikk').scrollIntoView(); return; }
  else if (d.act === 'retry') S.mode = 'items';
  else if (d.act === 'add') { S.items.push({ id:d.id, qty:1, checked:false }); syncOnList(); }
  else { const it = S.items.find(i => i.id === d.id);
    if (d.act === 'inc') it.qty = Math.min(99, it.qty + 1);
    if (d.act === 'dec') it.qty = Math.max(1, it.qty - 1);
    if (d.act === 'remove') { S.items = S.items.filter(i => i !== it); syncOnList(); }
    if (d.act === 'clear') { S.items = S.items.filter(i => !i.checked); syncOnList(); } }
  render();
});
document.addEventListener('change', e => { if (e.target.dataset.act === 'check') { S.items.find(i => i.id === e.target.dataset.id).checked = e.target.checked; render(); } });
document.getElementById('theme').addEventListener('click', () => document.documentElement.classList.toggle('dark'));
syncOnList(); render();
</script>
</body>
</html>
